# MCPs locais do FlowTest. Gerenciados por scripts/configure-mcp.ts.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 45

[mcp_servers.github]
command = "node"
args = ["scripts/github-mcp.ts"]
startup_timeout_sec = 45

[mcp_servers.playwright]
command = "node"
args = ["node_modules/@playwright/mcp/cli.js","--headless","--isolated","--browser","chromium","--output-dir","artifacts/playwright-mcp"]
startup_timeout_sec = 45

[mcp_servers.chrome-devtools]
command = "node"
args = ["scripts/chrome-devtools.ts"]
startup_timeout_sec = 45

[mcp_servers.shadcn]
command = "node"
args = ["node_modules/shadcn/dist/index.js","mcp"]
startup_timeout_sec = 45
